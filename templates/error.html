<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ error_code }} - {{ error_title }} | BAUST AI Help Desk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Immediate Theme Initializer -->
  <script>
    (function() {
      try {
        var isAdmin = window.location.pathname.indexOf('/admin') !== -1;
        var key = isAdmin ? "baust_admin_theme" : "baust_student_theme";
        var saved = localStorage.getItem(key);
        var theme = (saved === "light" || saved === "dark") ? saved : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <!-- External Unified Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=5.1">
</head>
<body class="login-page">

  <!-- Floating Theme Toggle -->
  <div class="top-controls">
    <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle Dark/Light Mode">
      <span id="themeIcon"></span>
      <span id="themeLabel">Night</span>
    </button>
  </div>

  <!-- Error Card -->
  <div class="login-card" style="max-width: 520px; text-align: center;">
    <div class="login-header">
      <div class="security-badge" style="background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: var(--danger);">
        <span class="security-dot" style="background: var(--danger);"></span>
        <span>HTTP Status {{ error_code }}</span>
      </div>
      <div class="brand-icon" style="margin: 16px auto 12px; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px;">
        {% if error_code == 429 %}
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        {% elif error_code == 404 %}
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        {% else %}
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        {% endif %}
      </div>
      <h1 style="font-size: 24px; margin-bottom: 8px;">{{ error_title }}</h1>
      <p style="font-size: 13.5px; line-height: 1.6; color: var(--text-muted); margin-bottom: 20px;">
        {{ error_message }}
      </p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
      <a href="{{ url_for('home') }}" class="btn-login" style="text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg class="btn-svg-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Return to Student Help Desk</span>
      </a>
      <a href="{{ url_for('admin_login') }}" class="back-link" style="margin-top: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
        <svg class="btn-svg-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>Administrator Access Portal</span>
      </a>
    </div>

    <div class="login-footer" style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 14px;">
      <div class="institution-copyright">
        © 2026 Bangladesh Army University of Science & Technology (BAUST)
      </div>
    </div>
  </div>

  <!-- Modular JavaScript Engine -->
  <script src="{{ url_for('static', filename='js/theme.js') }}?v=5.1"></script>
</body>
</html>
